# klab: only run when telemetry is requested, with extra kernel collectors.
[Unit]
ConditionKernelCommandLine=lab.telemetry=1

[Service]
ExecStart=
ExecStart=/usr/bin/prometheus-node-exporter --web.listen-address=:9100 \
    --collector.interrupts --collector.softirqs --collector.processes \
    --collector.textfile.directory=/var/lib/prometheus/node-exporter
