name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest and the newest Python the project supports (requires-python >= 3.10)
        python: ["3.10", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Image tools (Arch image integration test)
        run: sudo apt-get update && sudo apt-get install -y fakeroot dosfstools mtools

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v
