[project]
name = "klab"
version = "0.1.0"
description = "Fetch, build, boot (QEMU) and benchmark Linux kernels."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lab = "labtool.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "labtool"
module-root = ""

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 90
target-version = "py310"
src = ["labtool"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# E741 ambiguous var names (l): the code uses `l` for console lines in a few hot loops.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Nested `with` mock blocks read better than one long line.
"tests/*" = ["SIM117"]

[tool.mypy]
python_version = "3.10"
files = ["labtool"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
