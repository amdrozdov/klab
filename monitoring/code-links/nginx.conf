# Turns http links (which Grafana makes clickable) into editor links:
#   http://127.0.0.1:3001/code?path=/abs/file.c&line=42  ->  vscode://file/abs/file.c:42
# For another editor change the scheme (e.g. cursor://file, vscodium://file).
server {
    listen 127.0.0.1:3001;
    access_log off;
    location = /code {
        return 302 "vscode://file$arg_path:$arg_line";
    }
    location / {
        return 404 "use /code?path=/abs/file&line=N\n";
    }
}
