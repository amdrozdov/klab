<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- klab logo: Tux dripping a glowing reagent from a flask onto a chip. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22304a"/>
      <stop offset="1" stop-color="#0e1522"/>
    </linearGradient>
    <radialGradient id="belly" cx="0.45" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe3ea"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2f38"/>
      <stop offset="1" stop-color="#0b0d11"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd25a"/>
      <stop offset="1" stop-color="#f29a1f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe9ff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#cfe9ff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4658"/>
      <stop offset="1" stop-color="#232b37"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="flaskBody">
      <path d="M-8,-40 L-8,-12 L-28,26 Q-31,33 -23,33 L23,33 Q31,33 28,26 L8,-12 L8,-40 Z"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="400" height="400" rx="72" fill="url(#bg)"/>
  <circle cx="288" cy="258" r="74" fill="#7ee787" opacity="0.045"/>

  <!-- chip (hardware) -->
  <g id="chip">
    <g stroke="#e3b341" stroke-width="5" stroke-linecap="round">
      <path d="M252,226v-10 M269,226v-10 M286,226v-10 M303,226v-10 M320,226v-10"/>
      <path d="M252,306v10 M269,306v10 M286,306v10 M303,306v10 M320,306v10"/>
      <path d="M240,240h-10 M240,256h-10 M240,272h-10 M240,288h-10"/>
      <path d="M332,240h10 M332,256h10 M332,272h10 M332,288h10"/>
    </g>
    <rect x="240" y="226" width="92" height="80" rx="9" fill="url(#chip)" stroke="#5d6b80" stroke-width="2"/>
    <rect x="261" y="244" width="50" height="44" rx="5" fill="#2a3240" stroke="#7ee787" stroke-opacity="0.55" stroke-width="1.5"/>
    <path d="M268,256h12 M268,264h20 M268,272h9 M292,272h12" stroke="#7ee787" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
    <circle cx="249" cy="235" r="3" fill="#5d6b80"/>
  </g>

  <!-- splash on the die -->
  <g fill="#7ee787" filter="url(#glow)">
    <ellipse cx="287" cy="246" rx="15" ry="4" opacity="0.9"/>
    <circle cx="269" cy="236" r="2.6"/>
    <circle cx="305" cy="235" r="2.2"/>
    <circle cx="279" cy="230" r="1.8"/>
  </g>

  <!-- falling drops -->
  <g fill="#7ee787" filter="url(#glow)">
    <path d="M272,168 q-6,9 0,12 q6,-3 0,-12 Z"/>
    <path d="M279,190 q-7,11 0,14 q7,-3 0,-14 Z"/>
    <path d="M285,214 q-6,9 0,12 q6,-3 0,-12 Z"/>
  </g>

  <!-- Tux -->
  <g id="tux">
    <!-- left flipper (viewer's left) -->
    <path d="M86,168 Q56,214 70,262 Q80,252 92,226 Z" fill="url(#body)"/>
    <!-- body + head -->
    <ellipse cx="140" cy="196" rx="66" ry="84" fill="url(#body)"/>
    <circle cx="140" cy="108" r="50" fill="url(#body)"/>
    <!-- right flipper raised, holding the flask -->
    <path d="M186,166 Q200,134 200,108 Q214,110 212,128 Q206,166 196,192 Z" fill="url(#body)"/>
    <!-- belly -->
    <ellipse cx="140" cy="208" rx="46" ry="66" fill="url(#belly)"/>
    <!-- eyes -->
    <ellipse cx="124" cy="102" rx="15" ry="19" fill="#fff"/>
    <ellipse cx="156" cy="102" rx="15" ry="19" fill="#fff"/>
    <ellipse cx="129" cy="106" rx="6.5" ry="8.5" fill="#111"/>
    <ellipse cx="161" cy="106" rx="6.5" ry="8.5" fill="#111"/>
    <circle cx="131" cy="103" r="2.2" fill="#fff"/>
    <circle cx="163" cy="103" r="2.2" fill="#fff"/>
    <!-- beak -->
    <path d="M118,126 Q140,112 162,126 Q150,136 140,137 Q130,136 118,126 Z" fill="url(#beak)"/>
    <path d="M124,131 Q140,146 156,131 Q140,138 124,131 Z" fill="#e0861a"/>
    <!-- feet -->
    <ellipse cx="108" cy="279" rx="30" ry="11" fill="url(#beak)"/>
    <ellipse cx="172" cy="279" rx="30" ry="11" fill="url(#beak)"/>
  </g>

  <!-- flask, tilted so its mouth points at the chip -->
  <g transform="translate(232,128) rotate(135)">
    <g clip-path="url(#flaskBody)">
      <g transform="rotate(-135)">  <!-- back to screen axes: liquid surface stays level -->
        <rect x="-60" y="-6" width="120" height="80" fill="#7ee787" opacity="0.9"/>
        <rect x="-60" y="-6" width="120" height="3.5" fill="#b8f5bf"/>
        <circle cx="10" cy="14" r="3" fill="#d9ffdf" opacity="0.85"/>
        <circle cx="22" cy="6" r="2" fill="#d9ffdf" opacity="0.85"/>
      </g>
    </g>
    <path d="M-8,-40 L-8,-12 L-28,26 Q-31,33 -23,33 L23,33 Q31,33 28,26 L8,-12 L8,-40 Z"
          fill="url(#glass)" stroke="#dbe7f3" stroke-width="3" stroke-linejoin="round"/>
    <rect x="-12" y="-46" width="24" height="7" rx="3" fill="#dbe7f3"/>
    <!-- liquid running out of the mouth -->
    <path d="M-3,-46 q3,-6 6,0 Z" fill="#7ee787" filter="url(#glow)"/>
  </g>
  <!-- flipper tip over the flask, so Tux is holding it -->
  <ellipse cx="205" cy="107" rx="8" ry="12" transform="rotate(-40 205 107)" fill="#1a1e26"/>

  <!-- caption -->
  <text x="200" y="368" text-anchor="middle" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace"
        font-size="58" font-weight="bold" letter-spacing="2">
    <tspan fill="#7ee787">k</tspan><tspan fill="#f2f5f9">lab</tspan>
  </text>
</svg>
